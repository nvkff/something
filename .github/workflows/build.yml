name: Build Watch Face APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository with History
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Project Generator
        run: |
          python3 generate.py
          if [ ! -f "app/src/main/assets/minecraft.ttf" ]; then
            FONT_COMMIT=$(git log --all --diff-filter=A --format="%H" -- "**/minecraft.ttf" | head -n 1) || true
            if [ -n "$FONT_COMMIT" ]; then
              git checkout "$FONT_COMMIT" -- "**/minecraft.ttf" || true
            fi
            FOUND=$(find . -name "minecraft.ttf" ! -path "./app/src/main/assets/*" | head -n 1) || true
            if [ -n "$FOUND" ]; then
              cp "$FOUND" app/src/main/assets/minecraft.ttf
            fi
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.6"

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: watchface-debug
          path: app/build/outputs/apk/debug/*.apk

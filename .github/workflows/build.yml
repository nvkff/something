name: Build Watch Face APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository with History
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Run Project Generator
        run: |
          if [ ! -f "app/src/main/assets/minecraft.ttf" ]; then
            mkdir -p app/src/main/assets
            FONT_COMMIT=$(git log --all --diff-filter=A --format="%H" -- "**/minecraft.ttf" | head -n 1)
            if [ -n "$FONT_COMMIT" ]; then
              git checkout "$FONT_COMMIT" -- "**/minecraft.ttf" || true
            fi
            FOUND=$(find . -name "minecraft.ttf" ! -path "./app/src/main/assets/minecraft.ttf" | head -n 1) || true
            if [ -n "$FOUND" ]; then
              cp "$FOUND" app/src/main/assets/minecraft.ttf
            fi
          fi
          if [ ! -f "release.keystore" ]; then
            keytool -genkeypair -v -keystore release.keystore -alias watchkey -keyalg RSA -keysize 2048 -validity 10000 -storepass 123456 -keypass 123456 -dname "CN=WatchFace, OU=Dev, O=Dev, L=City, S=State, C=US"
          fi
          python3 generate.py

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.6"

      - name: Build Release APK
        run: gradle assembleRelease

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: watchface-release
          path: app/build/outputs/apk/release/*.apk

name: Build Watch Face APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate Raster PNG Preview
        run: |
          mkdir -p app/src/main/res/drawable
          python3 -c '
          import zlib, struct, math
          w, h = 400, 400
          raw = bytearray()
          for y in range(h):
              raw.append(0)
              for x in range(w):
                  d = math.hypot(x - 200, y - 200)
                  c = 255 if (180 <= d <= 192) else 0
                  raw.extend((c, c, c, 255))
          def chunk(t, d):
              return struct.pack("!I", len(d)) + t + d + struct.pack("!I", zlib.crc32(t + d) & 0xffffffff)
          png = b"\x89PNG\r\n\x1a\n" + chunk(b"IHDR", struct.pack("!IIBBBBB", w, h, 8, 6, 0, 0, 0)) + chunk(b"IDAT", zlib.compress(bytes(raw))) + chunk(b"IEND", b"")
          open("app/src/main/res/drawable/preview.png", "wb").write(png)
          '

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.6"

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: watchface-debug
          path: app/build/outputs/apk/debug/*.apk

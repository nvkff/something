<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Single Photo 3D Splat Cloud</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: #050508; color: #f4f4f5; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    #canvas-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; }

    /* Панель управления */
    .panel {
      position: absolute; top: 14px; left: 14px; width: 320px;
      background: rgba(15, 15, 22, 0.88); backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 12px;
      padding: 14px; z-index: 20; display: flex; flex-direction: column; gap: 10px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.6); transition: all 0.25s ease;
    }
    .panel.collapsed .panel-body { display: none; }
    .panel.collapsed { width: auto; padding: 8px 12px; }

    .panel-header { display: flex; justify-content: space-between; align-items: center; cursor: pointer; user-select: none; }
    .panel-title { font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 6px; }
    .toggle-btn {
      background: rgba(255,255,255,0.08); border: none; color: #a1a1aa;
      width: 24px; height: 24px; border-radius: 6px; cursor: pointer;
      display: flex; align-items: center; justify-content: center; font-size: 13px;
    }
    .toggle-btn:hover { background: rgba(255,255,255,0.2); color: #fff; }

    .panel-body { display: flex; flex-direction: column; gap: 10px; }

    .drop-zone {
      border: 1.5px dashed rgba(255, 255, 255, 0.2); border-radius: 8px;
      padding: 16px 10px; text-align: center; cursor: pointer; font-size: 12px; color: #a1a1aa;
      transition: 0.15s;
    }
    .drop-zone:hover { border-color: #6366f1; color: #fff; background: rgba(99, 102, 241, 0.08); }

    .control { display: flex; flex-direction: column; gap: 3px; font-size: 11px; color: #a1a1aa; }
    .control-header { display: flex; justify-content: space-between; }
    input[type="range"] { width: 100%; accent-color: #6366f1; cursor: pointer; }

    .btn-row { display: flex; gap: 6px; }
    button.action-btn {
      flex: 1; padding: 7px 8px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.12);
      background: rgba(255,255,255,0.06); color: #fff; font-size: 11px; cursor: pointer;
    }
    button.action-btn:hover { background: rgba(99,102,241,0.25); border-color: #6366f1; }
    button.action-btn.active { background: #6366f1; border-color: #6366f1; }

    #status { font-size: 11px; color: #818cf8; min-height: 14px; }
    .mode-switch { display: flex; background: rgba(0,0,0,0.3); padding: 2px; border-radius: 6px; gap: 2px; }
    .mode-switch button { flex: 1; padding: 5px; font-size: 11px; border: none; background: transparent; color: #a1a1aa; border-radius: 4px; cursor: pointer; }
    .mode-switch button.active { background: #6366f1; color: #fff; font-weight: 500; }
  </style>
</head>
<body>

<div class="panel" id="panel">
  <div class="panel-header" id="panel-header">
    <div class="panel-title">
      <span>3D Splat View</span>
    </div>
    <button class="toggle-btn" id="btn-toggle" title="Свернуть / Развернуть меню">_</button>
  </div>

  <div class="panel-body">
    <div class="mode-switch">
      <button id="mode-fast" class="active">Мгновенный (Контраст)</button>
      <button id="mode-ai">Нейросеть (AI)</button>
    </div>

    <label class="drop-zone" id="drop-zone">
      Выбери ОДНО фото (или перетащи)
      <input type="file" id="file-input" accept="image/*" hidden>
    </label>

    <div id="status">Загрузи снимок для старта</div>

    <div class="control">
      <div class="control-header"><span>Плотность точек</span><span id="val-lod">500K</span></div>
      <input type="range" id="rng-lod" min="200" max="1000" step="50" value="700">
    </div>

    <div class="control">
      <div class="control-header"><span>Выраженность объема (Z)</span><span id="val-depth">1.6</span></div>
      <input type="range" id="rng-depth" min="0" max="4.0" step="0.05" value="1.6">
    </div>

    <div class="control">
      <div class="control-header"><span>Размер сплэтов</span><span id="val-size">6.0</span></div>
      <input type="range" id="rng-size" min="1" max="16" step="0.2" value="6.0">
    </div>

    <div class="control">
      <div class="control-header"><span>Мягкость Гауссианы</span><span id="val-soft">1.4</span></div>
      <input type="range" id="rng-soft" min="0.5" max="3.0" step="0.1" value="1.4">
    </div>

    <div class="btn-row">
      <button class="action-btn active" id="btn-orbit">Облет</button>
      <button class="action-btn" id="btn-invert">Инверт Z</button>
      <button class="action-btn" id="btn-reset">Сброс</button>
    </div>
  </div>
</div>

<div id="canvas-container"></div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/",
    "@huggingface/transformers": "https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.3.3"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { pipeline } from '@huggingface/transformers';

// UI элементы
const panel = document.getElementById('panel');
const btnToggle = document.getElementById('btn-toggle');
const statusEl = document.getElementById('status');

// Сворачивание панели
btnToggle.addEventListener('click', (e) => {
  e.stopPropagation();
  panel.classList.toggle('collapsed');
  btnToggle.textContent = panel.classList.contains('collapsed') ? '□' : '_';
});

// Three.js сцена
const container = document.getElementById('canvas-container');
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(48, window.innerWidth / window.innerHeight, 0.05, 100);
camera.position.set(0, 0, 3.0);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, powerPreference: 'high-performance' });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
container.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;

// Шейдер: строго правильная ориентация Y и предотвращение мерцания
const vertexShader = `
  uniform sampler2D uDepthMap;
  uniform sampler2D uColorMap;
  uniform float uDepthScale;
  uniform float uPointSize;
  uniform float uInvert;
  varying vec3 vColor;

  void main() {
    // Входные координаты uv лежат в диапазоне [0..1]
    vec2 uv = position.xy;
    
    // Текстура берется без переворота
    vec4 col = texture2D(uColorMap, uv);
    vColor = col.rgb;

    float rawD = texture2D(uDepthMap, uv).r;
    float d = uInvert > 0.5 ? (1.0 - rawD) : rawD;

    // Центрируем: верх остается вверху (Y умножаем на положительное значение, от 0.5 отнимаем)
    float aspect = position.z;
    vec3 pos = vec3(
      (uv.x - 0.5) * aspect * 2.2,
      (0.5 - uv.y) * 2.2,
      (d - 0.5) * uDepthScale
    );

    vec4 mvPosition = modelViewMatrix * vec4(pos, 1.0);
    gl_Position = projectionMatrix * mvPosition;

    // Размер точки стабилизирован
    gl_PointSize = uPointSize * (3.0 / -mvPosition.z);
  }
`;

const fragmentShader = `
  uniform float uSoftness;
  varying vec3 vColor;

  void main() {
    vec2 coord = gl_PointCoord - vec2(0.5);
    float distSq = dot(coord, coord) * 4.0;
    if (distSq > 1.0) discard;

    // Плавная гауссиана по краям
    float alpha = exp(-distSq * (2.2 / uSoftness));
    gl_FragColor = vec4(vColor, alpha * 0.95);
  }
`;

const uniforms = {
  uDepthMap: { value: null },
  uColorMap: { value: null },
  uDepthScale: { value: 1.6 },
  uPointSize: { value: 6.0 },
  uSoftness: { value: 1.4 },
  uInvert: { value: 0.0 }
};

let splatPoints = null;
let currentDepthTex = null;
let currentColorTex = null;
let currentAspect = 1.0;
let currentMode = 'fast'; // 'fast' или 'ai'
let depthPipeline = null;

function rebuildMesh() {
  if (!currentDepthTex || !currentColorTex) return;

  if (splatPoints) {
    scene.remove(splatPoints);
    splatPoints.geometry.dispose();
  }

  const baseRes = parseInt(document.getElementById('rng-lod').value);
  const w = Math.round(baseRes * (currentAspect >= 1 ? currentAspect : 1));
  const h = Math.round(baseRes / (currentAspect < 1 ? currentAspect : 1));
  const total = w * h;

  document.getElementById('val-lod').textContent = total > 1e6 ? `${(total/1e6).toFixed(1)}M` : `${Math.round(total/1e3)}K`;

  const positions = new Float32Array(total * 3);
  let p = 0;

  for (let y = 0; y < h; y++) {
    const v = y / (h - 1);
    for (let x = 0; x < w; x++) {
      const u = x / (w - 1);
      positions[p * 3]     = u;
      positions[p * 3 + 1] = v;
      positions[p * 3 + 2] = currentAspect;
      p++;
    }
  }

  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  geometry.computeBoundingSphere(); // Чтобы сцена не исчезала

  const material = new THREE.ShaderMaterial({
    vertexShader,
    fragmentShader,
    uniforms,
    transparent: true,
    depthWrite: false, // Отключаем глубину для устранения мерцания
    depthTest: true,
    blending: THREE.NormalBlending
  });

  splatPoints = new THREE.Points(geometry, material);
  splatPoints.frustumCulled = false; // Защита от пропадания при повороте
  scene.add(splatPoints);
}

// Быстрый алгоритм без нейросети (мгновенно, без скачивания)
function createFastDepth(img, w, h) {
  const canvas = document.createElement('canvas');
  canvas.width = w; canvas.height = h;
  const ctx = canvas.getContext('2d');
  ctx.drawImage(img, 0, 0, w, h);
  const imgData = ctx.getImageData(0, 0, w, h);
  const d = imgData.data;

  // Комбинация: низ кадра ближе + яркие акценты
  for (let y = 0; y < h; y++) {
    const yGrad = y / h;
    for (let x = 0; x < w; x++) {
      const i = (y * w + x) * 4;
      const lum = (0.299 * d[i] + 0.587 * d[i+1] + 0.114 * d[i+2]) / 255.0;
      const depth = Math.min(255, Math.max(0, (yGrad * 0.7 + lum * 0.3) * 255));
      d[i] = depth;
      d[i+1] = depth;
      d[i+2] = depth;
    }
  }
  ctx.putImageData(imgData, 0, 0);

  const tex = new THREE.CanvasTexture(canvas);
  tex.minFilter = THREE.LinearFilter;
  tex.magFilter = THREE.LinearFilter;
  tex.flipY = false;
  return tex;
}

// Загрузка и рендер файла
let currentImgElement = null;

async function loadSinglePhoto(file) {
  statusEl.textContent = 'Чтение файла...';
  const url = URL.createObjectURL(file);
  const img = new Image();
  img.src = url;
  await img.decode();
  currentImgElement = img;

  currentAspect = img.naturalWidth / img.naturalHeight;

  // Цветная текстура (без переворота)
  currentColorTex = new THREE.Texture(img);
  currentColorTex.minFilter = THREE.LinearFilter;
  currentColorTex.magFilter = THREE.LinearFilter;
  currentColorTex.flipY = false;
  currentColorTex.needsUpdate = true;
  uniforms.uColorMap.value = currentColorTex;

  if (currentMode === 'fast') {
    statusEl.textContent = 'Расчет быстрой глубины...';
    currentDepthTex = createFastDepth(img, 512, Math.round(512 / currentAspect));
    uniforms.uDepthMap.value = currentDepthTex;
    rebuildMesh();
    statusEl.textContent = `Готово! ${img.naturalWidth}×${img.naturalHeight}`;
  } else {
    runAiDepth(url);
  }
}

async function runAiDepth(url) {
  try {
    if (!depthPipeline) {
      statusEl.textContent = 'Инициализация AI модели (~25МБ)...';
      depthPipeline = await pipeline('depth-estimation', 'onnx-community/Depth-Anything-V2-Small', {
        device: navigator.gpu ? 'webgpu' : 'wasm'
      });
    }

    statusEl.textContent = 'Нейросеть вычисляет объем...';
    const result = await depthPipeline(url);

    const canvas = document.createElement('canvas');
    canvas.width = result.depth.width;
    canvas.height = result.depth.height;
    const ctx = canvas.getContext('2d');
    const imgData = ctx.createImageData(canvas.width, canvas.height);

    for (let i = 0; i < result.depth.data.length; i++) {
      const v = result.depth.data[i];
      imgData.data[i * 4] = v;
      imgData.data[i * 4 + 1] = v;
      imgData.data[i * 4 + 2] = v;
      imgData.data[i * 4 + 3] = 255;
    }
    ctx.putImageData(imgData, 0, 0);

    currentDepthTex = new THREE.CanvasTexture(canvas);
    currentDepthTex.minFilter = THREE.LinearFilter;
    currentDepthTex.magFilter = THREE.LinearFilter;
    currentDepthTex.flipY = false;
    uniforms.uDepthMap.value = currentDepthTex;

    rebuildMesh();
    statusEl.textContent = 'AI Глубина построена!';
  } catch (err) {
    statusEl.textContent = 'Ошибка AI. Переключено на быстрый режим.';
    currentDepthTex = createFastDepth(currentImgElement, 512, Math.round(512 / currentAspect));
    uniforms.uDepthMap.value = currentDepthTex;
    rebuildMesh();
  }
}

// Слушатели событий
const dropZone = document.getElementById('drop-zone');
const fileInput = document.getElementById('file-input');
dropZone.onclick = () => fileInput.click();
fileInput.onchange = e => e.target.files[0] && loadSinglePhoto(e.target.files[0]);

dropZone.ondragover = e => { e.preventDefault(); dropZone.style.borderColor = '#6366f1'; };
dropZone.ondragleave = () => { dropZone.style.borderColor = 'rgba(255,255,255,0.2)'; };
dropZone.ondrop = e => {
  e.preventDefault();
  dropZone.style.borderColor = 'rgba(255,255,255,0.2)';
  if (e.dataTransfer.files[0]) loadSinglePhoto(e.dataTransfer.files[0]);
};

// Переключатели режимов
const btnFast = document.getElementById('mode-fast');
const btnAi = document.getElementById('mode-ai');
btnFast.onclick = () => {
  currentMode = 'fast';
  btnFast.classList.add('active');
  btnAi.classList.remove('active');
  if (currentImgElement) loadSinglePhoto(fileInput.files[0] || currentImgElement);
};
btnAi.onclick = () => {
  currentMode = 'ai';
  btnAi.classList.add('active');
  btnFast.classList.remove('active');
  if (currentImgElement) loadSinglePhoto(fileInput.files[0] || currentImgElement);
};

// Ползунки
document.getElementById('rng-lod').oninput = rebuildMesh;
document.getElementById('rng-depth').oninput = e => {
  uniforms.uDepthScale.value = parseFloat(e.target.value);
  document.getElementById('val-depth').textContent = e.target.value;
};
document.getElementById('rng-size').oninput = e => {
  uniforms.uPointSize.value = parseFloat(e.target.value);
  document.getElementById('val-size').textContent = e.target.value;
};
document.getElementById('rng-soft').oninput = e => {
  uniforms.uSoftness.value = parseFloat(e.target.value);
  document.getElementById('val-soft').textContent = e.target.value;
};

let autoOrbit = true;
const btnOrbit = document.getElementById('btn-orbit');
btnOrbit.onclick = () => { autoOrbit = !autoOrbit; btnOrbit.classList.toggle('active', autoOrbit); };

const btnInvert = document.getElementById('btn-invert');
btnInvert.onclick = () => {
  uniforms.uInvert.value = uniforms.uInvert.value > 0.5 ? 0.0 : 1.0;
  btnInvert.classList.toggle('active', uniforms.uInvert.value > 0.5);
};

document.getElementById('btn-reset').onclick = () => {
  camera.position.set(0, 0, 3.0);
  controls.target.set(0, 0, 0);
};

// Рендер-луп
let clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();
  if (autoOrbit && splatPoints) {
    splatPoints.rotation.y = Math.sin(t * 0.6) * 0.25;
    splatPoints.rotation.x = Math.cos(t * 0.4) * 0.09;
  }
  controls.update();
  renderer.render(scene, camera);
}
animate();

window.onresize = () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
};
</script>
</body>
</html>

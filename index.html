<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>Workspace</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      min-height: 100dvh;
      background: #050608 radial-gradient(circle at 50% 50%, rgba(56, 189, 248, 0.05) 0%, transparent 60%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    .btn-wrap {
      position: relative;
      border-radius: 9999px;
      padding: 1px;
      overflow: hidden;
      display: inline-flex;
    }

    .btn-wrap::before {
      content: '';
      position: absolute;
      inset: -150%;
      background: conic-gradient(
        from 0deg,
        transparent 0deg 140deg,
        rgba(255, 255, 255, 0.45) 180deg,
        transparent 220deg 360deg
      );
      animation: spin 6s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .btn {
      position: relative;
      z-index: 1;
      display: inline-flex;
      align-items: center;
      gap: 12px;
      height: 52px;
      padding: 0 24px 0 18px;
      background: #0c0d12;
      color: #f1f3f7;
      text-decoration: none;
      font-size: 15px;
      font-weight: 500;
      border-radius: 9999px;
      box-shadow: 
        inset 0 1px 0 rgba(255, 255, 255, 0.12),
        inset 0 -1px 0 rgba(0, 0, 0, 0.6),
        0 20px 40px -10px rgba(0, 0, 0, 0.9);
      transition: all 0.15s ease;
      user-select: none;
    }

    .indicator-box {
      position: relative;
      width: 8px;
      height: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .indicator-ping {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: #22c55e;
      animation: ping 2.4s cubic-bezier(0, 0, 0.2, 1) infinite;
    }

    .indicator-dot {
      width: 6px;
      height: 6px;
      background: #22c55e;
      border-radius: 50%;
      box-shadow: 0 0 6px rgba(34, 197, 94, 0.8);
    }

    @keyframes ping {
      0% { transform: scale(1); opacity: 0.7; }
      70%, 100% { transform: scale(2.6); opacity: 0; }
    }

    .arrow {
      color: #64748b;
      transition: transform 0.15s ease, color 0.15s ease;
    }

    .btn:hover .arrow {
      transform: translateX(3px);
      color: #f1f3f7;
    }

    .btn:active {
      transform: scale(0.97);
      background: #14151b;
    }
  </style>
</head>
<body>

  <div class="btn-wrap">
    <a href="https://3000-agq4ans63ibmqqimdanbjttyby.instabox.tech" class="btn" target="_blank" rel="noopener noreferrer">
      <span class="indicator-box">
        <span class="indicator-ping"></span>
        <span class="indicator-dot"></span>
      </span>
      <span>Подключиться</span>
      <svg class="arrow" width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 8h10M9 4l4 4-4 4"/>
      </svg>
    </a>
  </div>

</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>Workspace</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      min-height: 100dvh;
      background: #050608 radial-gradient(circle at 50% 30%, rgba(56, 189, 248, 0.05) 0%, transparent 60%);
      color: #e2e8f0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 24px;
      overflow: hidden;
    }

    .btn-wrap {
      position: relative;
      border-radius: 9999px;
      padding: 1px;
      overflow: hidden;
      display: inline-flex;
    }
    .btn-wrap::before {
      content: '';
      position: absolute;
      inset: -150%;
      background: conic-gradient(from 0deg, transparent 0deg 140deg, rgba(255, 255, 255, 0.45) 180deg, transparent 220deg 360deg);
      animation: spin 6s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .btn {
      position: relative;
      z-index: 1;
      display: inline-flex;
      align-items: center;
      gap: 12px;
      height: 52px;
      padding: 0 24px 0 18px;
      background: #0c0d12;
      color: #f1f3f7;
      text-decoration: none;
      font-size: 15px;
      font-weight: 500;
      border-radius: 9999px;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.12), 0 20px 40px -10px rgba(0, 0, 0, 0.9);
      transition: transform 0.15s ease, background 0.15s ease;
      user-select: none;
    }
    .indicator-box { position: relative; width: 8px; height: 8px; display: flex; align-items: center; justify-content: center; }
    .indicator-ping { position: absolute; inset: 0; border-radius: 50%; background: #22c55e; animation: ping 2.4s cubic-bezier(0, 0, 0.2, 1) infinite; }
    .indicator-dot { width: 6px; height: 6px; background: #22c55e; border-radius: 50%; box-shadow: 0 0 6px rgba(34, 197, 94, 0.8); }
    .offline .indicator-ping, .offline .indicator-dot { background: #f59e0b; box-shadow: 0 0 6px rgba(245, 158, 11, 0.8); }
    @keyframes ping { 0% { transform: scale(1); opacity: 0.7; } 70%, 100% { transform: scale(2.6); opacity: 0; } }
    .arrow { color: #64748b; transition: transform 0.15s ease, color 0.15s ease; }
    .btn:hover .arrow { transform: translateX(3px); color: #f1f3f7; }
    .btn:active { transform: scale(0.97); background: #14151b; }

    .fab-gauge {
      position: fixed;
      right: calc(20px + env(safe-area-inset-right, 0px));
      bottom: calc(20px + env(safe-area-inset-bottom, 0px));
      z-index: 10;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: #0c0d12;
      border: 1px solid #1a1e26;
      color: #8b949e;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08), 0 10px 25px rgba(0, 0, 0, 0.7);
      transition: color 0.15s ease, border-color 0.15s ease, transform 0.15s ease;
    }
    .fab-gauge:hover { color: #f1f3f7; border-color: #2d333b; }
    .fab-gauge:active { transform: scale(0.94); }

    .modal-overlay {
      position: fixed;
      inset: 0;
      z-index: 50;
      background: rgba(3, 4, 6, 0.72);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      display: flex;
      align-items: safe center;
      justify-content: center;
      overflow-y: auto;
      padding: 20px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }
    .modal-overlay.open { opacity: 1; pointer-events: auto; }

    .dash {
      width: 100%;
      max-width: 660px;
      background: #0b0d11;
      border: 1px solid #1a1e26;
      border-radius: 12px;
      padding: 18px 20px 16px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.9);
      transform: translateY(10px) scale(0.98);
      transition: transform 0.2s ease;
      margin: auto;
    }
    .modal-overlay.open .dash { transform: translateY(0) scale(1); }

    .dash-head {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 12px;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid #161a22;
    }
    .dash-title { font-size: 12.5px; font-weight: 600; color: #a8b3c1; }
    .dash-actions { display: flex; align-items: center; gap: 10px; }
    .btn-close {
      background: transparent;
      border: none;
      color: #6b7482;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 24px;
      height: 24px;
      border-radius: 5px;
    }
    .btn-close:hover { color: #e6ebf2; background: #161a22; }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 3px 8px;
      border-radius: 5px;
      font-size: 10.5px;
      font-weight: 500;
      white-space: nowrap;
      color: #3fb950;
      background: rgba(63, 185, 80, 0.08);
      border: 1px solid rgba(63, 185, 80, 0.18);
    }
    .badge::before { content: ''; width: 5px; height: 5px; border-radius: 50%; background: currentColor; }
    .badge.sleep { color: #d29922; background: rgba(210, 153, 34, 0.08); border-color: rgba(210, 153, 34, 0.2); }

    .metrics {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 10px;
      margin-bottom: 20px;
    }
    .m-box { background: #0e1116; border: 1px solid #191d25; border-radius: 8px; padding: 11px 12px 12px; }
    .m-label { font-size: 10.5px; color: #6b7482; }
    .m-val {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 17px;
      font-weight: 600;
      color: #e6ebf2;
      margin: 5px 0 9px;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }
    .progress { height: 3px; border-radius: 2px; background: #181c24; overflow: hidden; }
    .fill { height: 100%; width: 0%; border-radius: 2px; transition: width 0.5s ease; }
    #barUptime { background: #3fb950; }
    #barDisk   { background: #58a6ff; }
    #barRam    { background: #79c0ff; }
    #barTx     { background: #bc8cff; }

    .cycle-title { font-size: 10.5px; color: #6b7482; margin-bottom: 8px; }
    .cycle-wrap { position: relative; margin-bottom: 10px; cursor: crosshair; touch-action: pan-y; }
    .cycle-bar { display: flex; height: 12px; border-radius: 3px; overflow: hidden; background: #151920; }
    .cycle-bar > div + div { border-left: 1px solid #0b0d11; }
    .c-ok    { background: #2ea043; }
    .c-pause { background: #c08a2e; }
    .c-cool  { background: #6e56cf; }

    .now-mark {
      position: absolute;
      top: -3px;
      bottom: -3px;
      width: 2px;
      border-radius: 1px;
      background: #e6ebf2;
      box-shadow: 0 0 0 1px rgba(11, 13, 17, 0.85);
      pointer-events: none;
    }

    /* Всплывающий тултип времени над шкалой */
    .bar-tip {
      position: absolute;
      bottom: 20px;
      transform: translateX(-50%);
      background: #161b22;
      border: 1px solid #2d333b;
      color: #e6ebf2;
      font-size: 10.5px;
      padding: 3px 7px;
      border-radius: 4px;
      white-space: nowrap;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.12s ease;
      font-variant-numeric: tabular-nums;
      z-index: 5;
    }
    .bar-tip.show { opacity: 1; }

    .cycle-sub {
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 6px 10px;
      font-size: 10px;
      color: #596373;
      font-variant-numeric: tabular-nums;
    }
    #lastSync { color: #6b7482; }
  </style>
</head>
<body>

  <div class="btn-wrap">
    <a href="https://3000-agq4ans63ibmqqimdanbjttyby.instabox.tech" class="btn" target="_blank" rel="noopener noreferrer">
      <span class="indicator-box" id="indBox">
        <span class="indicator-ping"></span>
        <span class="indicator-dot"></span>
      </span>
      <span>Подключиться</span>
      <svg class="arrow" width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 8h10M9 4l4 4-4 4"/>
      </svg>
    </a>
  </div>

  <button class="fab-gauge" id="openDashBtn" aria-label="Телеметрия">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 14l4-4"/><path d="M3.34 19a10 10 0 1 1 17.32 0"/>
    </svg>
  </button>

  <div class="modal-overlay" id="dashOverlay">
    <div class="dash">
      <div class="dash-head">
        <span class="dash-title">Mashinka Telemetry</span>
        <div class="dash-actions">
          <span class="badge" id="statusBadge">Проверка…</span>
          <button class="btn-close" id="closeDashBtn" aria-label="Закрыть">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
              <path d="M4 4l8 8M12 4l-8 8"/>
            </svg>
          </button>
        </div>
      </div>

      <div class="metrics">
        <div class="m-box">
          <div class="m-label">Аптайм сессии</div>
          <div class="m-val" id="valUptime">—</div>
          <div class="progress"><div class="fill" id="barUptime"></div></div>
        </div>
        <div class="m-box">
          <div class="m-label">Диск /data</div>
          <div class="m-val" id="valDisk">—</div>
          <div class="progress"><div class="fill" id="barDisk"></div></div>
        </div>
        <div class="m-box">
          <div class="m-label">Память RAM</div>
          <div class="m-val" id="valRam">—</div>
          <div class="progress"><div class="fill" id="barRam"></div></div>
        </div>
        <div class="m-box">
          <div class="m-label">Трафик Egress</div>
          <div class="m-val" id="valTx">—</div>
          <div class="progress"><div class="fill" id="barTx"></div></div>
        </div>
      </div>

      <div class="cycle-title">Профиль 24ч цикла (наведите или коснитесь для времени)</div>
      <div class="cycle-wrap" id="cycleWrap">
        <div class="bar-tip" id="barTip">00:00</div>
        <div class="cycle-bar">
          <div class="c-ok" style="width: 33%"></div>
          <div class="c-pause" style="width: 2%"></div>
          <div class="c-ok" style="width: 33%"></div>
          <div class="c-pause" style="width: 2%"></div>
          <div class="c-ok" style="width: 17%"></div>
          <div class="c-cool" style="width: 13%"></div>
        </div>
        <div class="now-mark" id="nowMark"></div>
      </div>
      <div class="cycle-sub">
        <span>06:00 Старт</span>
        <span>14:00 Речек</span>
        <span>22:00 Речек</span>
        <span id="lastSync">Синхронизация…</span>
      </div>
    </div>
  </div>

<script>
  const API_URL = "https://8080-agq4ans63ibmqqimdanbjttyby.instabox.tech/?stats=1";
  const overlay = document.getElementById('dashOverlay');
  const openBtn = document.getElementById('openDashBtn');
  const closeBtn = document.getElementById('closeDashBtn');
  const cycleWrap = document.getElementById('cycleWrap');
  const barTip = document.getElementById('barTip');

  function openDash() {
    overlay.classList.add('open');
    loadTelemetry(true);
    updateNowMark();
    closeBtn.focus();
  }
  function closeDash() {
    overlay.classList.remove('open');
    barTip.classList.remove('show');
    openBtn.focus();
  }

  openBtn.addEventListener('click', openDash);
  closeBtn.addEventListener('click', closeDash);
  overlay.addEventListener('click', (e) => { if (e.target === overlay) closeDash(); });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && overlay.classList.contains('open')) closeDash();
  });

  // Интерактивное отображение времени и фазы при наведении/касании шкалы
  function showTimeAt(clientX) {
    const rect = cycleWrap.getBoundingClientRect();
    const ratio = Math.max(0, Math.min(1, (clientX - rect.left) / rect.width));
    const totalMinutes = Math.round(((6 + ratio * 24) % 24) * 60);
    const h = Math.floor(totalMinutes / 60) % 24;
    const m = totalMinutes % 60;
    const pct = ratio * 100;

    let phase = 'Работа';
    if (pct >= 33 && pct < 35) phase = 'Речек памяти';
    else if (pct >= 68 && pct < 70) phase = 'Речек памяти';
    else if (pct >= 87) phase = 'Ночной сон';

    const timeFormatted = `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')} MSK`;
    barTip.innerText = `${timeFormatted} — ${phase}`;
    barTip.style.left = `${Math.max(12, Math.min(88, pct))}%`;
    barTip.classList.add('show');
  }

  cycleWrap.addEventListener('mousemove', (e) => showTimeAt(e.clientX));
  cycleWrap.addEventListener('mouseleave', () => barTip.classList.remove('show'));
  cycleWrap.addEventListener('touchstart', (e) => showTimeAt(e.touches[0].clientX), { passive: true });
  cycleWrap.addEventListener('touchmove', (e) => showTimeAt(e.touches[0].clientX), { passive: true });

  let lastFetchTs = 0;
  async function loadTelemetry(force = false) {
    const now = Date.now();
    if (!force && now - lastFetchTs < 5000) return;
    lastFetchTs = now;
    try {
      const res = await fetch(API_URL, { cache: "no-store" });
      if (!res.ok) throw new Error("Offline");
      const data = await res.json();
      localStorage.setItem("mashinka_cache", JSON.stringify(data));
      renderStats(data, true);
    } catch (e) {
      const cached = localStorage.getItem("mashinka_cache");
      if (cached) {
        renderStats(JSON.parse(cached), false);
      } else {
        document.getElementById('statusBadge').innerText = 'ВО СНЕ / НЕДОСТУПЕН';
        document.getElementById('statusBadge').className = 'badge sleep';
        document.getElementById('indBox').className = 'indicator-box offline';
      }
    }
  }

  function renderStats(d, isLive) {
    const h = Math.floor(d.uptime_sec / 3600);
    const m = Math.floor((d.uptime_sec % 3600) / 60);
    document.getElementById('valUptime').innerText = `${h}ч ${m}м`;
    document.getElementById('barUptime').style.width = Math.min(100, (h / 20) * 100) + '%';

    document.getElementById('valDisk').innerText = `${d.disk_used_gb} / ${d.disk_total_gb} GB`;
    document.getElementById('barDisk').style.width = d.disk_pct + '%';

    document.getElementById('valRam').innerText = `${d.ram_used_gb} / ${d.ram_total_gb} GB`;
    document.getElementById('barRam').style.width = d.ram_pct + '%';

    document.getElementById('valTx').innerText = `${d.tx_mb} MB`;
    document.getElementById('barTx').style.width = Math.max(2, (d.tx_mb / 1024)) + '%';

    const badge = document.getElementById('statusBadge');
    const ind = document.getElementById('indBox');
    const timeStr = new Date(d.ts * 1000).toLocaleTimeString('ru-RU', {
      timeZone: 'Europe/Moscow',
      hour: '2-digit',
      minute: '2-digit'
    });

    if (isLive) {
      badge.innerText = 'ONLINE (200 OK)';
      badge.className = 'badge';
      ind.className = 'indicator-box';
      document.getElementById('lastSync').innerText = `Обновлено: ${timeStr} MSK`;
    } else {
      badge.innerText = 'ПАУЗА / СОН (КЭШ)';
      badge.className = 'badge sleep';
      ind.className = 'indicator-box offline';
      document.getElementById('lastSync').innerText = `Был в сети: ${timeStr} MSK`;
    }
  }

  function updateNowMark() {
    if (!overlay.classList.contains('open')) return;
    const now = new Date();
    const mskH = (now.getUTCHours() + 3) % 24;
    const mskM = now.getUTCMinutes();
    const pos = (((mskH + mskM / 60) - 6 + 24) % 24) / 24 * 100;
    document.getElementById('nowMark').style.left = pos + '%';
  }

  loadTelemetry();
  setInterval(loadTelemetry, 30000);
  setInterval(updateNowMark, 60000);
</script>
</body>
</html>
